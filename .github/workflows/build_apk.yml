name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Clean and Re-generate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=pilot_plug

      - name: Force Geolocator Android to 4.6.1
        run: |
          python3 -c "
          with open('pubspec.yaml', 'r') as f:
              content = f.read()
          if 'dependency_overrides:' in content:
              content = content.replace('dependency_overrides:', 'dependency_overrides:\n  geolocator_android: 4.6.1')
          else:
              content += '\ndependency_overrides:\n  geolocator_android: 4.6.1\n'
          with open('pubspec.yaml', 'w') as f:
              f.write(content)
          "
          rm -f pubspec.lock
          flutter pub get

      - name: Add Permissions to AndroidManifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
