name: Build Release APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Lib Folder Casing
        run: |
          if [ -d "Lib" ]; then mv Lib lib; fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Re-generate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=pilot_plug

      - name: Clean Lockfile and Fetch Dependencies
        run: |
          rm -f pubspec.lock
          flutter pub get

      - name: Generate Android App Icons
        run: |
          if [ -f "icon.png" ]; then
            dart run flutter_launcher_icons
          else
            echo "WARNING: Walang icon.png na nahanap sa root directory!"
          fi

      - name: Add Permissions to AndroidManifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-plug-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
