name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Fix Folder Case
        run: |
          if [ -d "Lib" ]; then mv Lib lib; fi

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.3'
          channel: 'stable'

      - name: Clean and Re-generate Android Project
        run: |
          rm -rf android
          flutter create . --platforms=android --project-name=pilot_plug

      - name: Configure Android SDK and Kotlin Versions
        run: |
          # Set compileSdk 35 and minSdk 21 in build.gradle
          sed -i 's/compileSdk = .*/compileSdk = 35/' android/app/build.gradle || true
          sed -i 's/compileSdkVersion .*/compileSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 35/' android/app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 35/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true

          # Force subproject plugins to compile with SDK 35
          echo "subprojects { afterEvaluate { project -> if (project.hasProperty('android')) { project.android { compileSdkVersion 35 } } } }" >> android/build.gradle

          # Update Kotlin version to 1.9.22 to fix metadata mismatch
          sed -i 's/ext.kotlin_version = .*/ext.kotlin_version = "1.9.22"/' android/build.gradle || true
          sed -i 's/id "org.jetbrains.kotlin.android" version .*/id "org.jetbrains.kotlin.android" version "1.9.22" apply false/' android/settings.gradle || true

      - name: Add Permissions to AndroidManifest
        run: |
          sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>' android/app/src/main/AndroidManifest.xml

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilot-plug-app-release
          path: build/app/outputs/flutter-apk/app-release.apk
